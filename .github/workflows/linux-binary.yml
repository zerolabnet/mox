name: Linux binary

on:
  workflow_dispatch:
  push:

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - run: make frontend

      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o mox

      - uses: actions/upload-artifact@v7
        with:
          name: mox-linux-amd64
          path: mox
          if-no-files-found: error
